worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 80;
        server_name zuotijia.ddns.net;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            allow all;
        }

        location /health {
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name stocks.zuotijia.ddns.net;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            allow all;
        }

        location /health {
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        server_name zuotijia.ddns.net;
        server_name 140.245.56.252;

        resolver 127.0.0.11 valid=10s;

        ssl_certificate /etc/letsencrypt/live/zuotijia.ddns.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zuotijia.ddns.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            allow all;
        }

        location /health {
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }

        location /api/v1/ {
            set $study_backend_upstream study-assistant-backend:8000;
            proxy_pass http://$study_backend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Origin $http_origin;
            proxy_set_header Connection keep-alive;

            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            fastcgi_buffering off;
            chunked_transfer_encoding on;
        }
    }
}
